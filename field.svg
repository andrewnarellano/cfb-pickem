<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 533" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Hash marks at both NFL hash positions, every yard (every 10px along x) -->
    <pattern id="h" x="100" y="0" width="10" height="533" patternUnits="userSpaceOnUse">
      <line x1="5" y1="224" x2="5" y2="240" stroke="white" stroke-width="2.5" opacity="0.45"/>
      <line x1="5" y1="293" x2="5" y2="309" stroke="white" stroke-width="2.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- ── End zones ── -->
  <rect x="0"    y="0" width="100"  height="533" fill="#1a5c1a"/>
  <rect x="1100" y="0" width="100"  height="533" fill="#1a5c1a"/>

  <!-- ── Alternating grass stripes (10 yards = 100px each) ── -->
  <rect x="100"  y="0" width="100" height="533" fill="#2e8c2e"/>
  <rect x="200"  y="0" width="100" height="533" fill="#267826"/>
  <rect x="300"  y="0" width="100" height="533" fill="#2e8c2e"/>
  <rect x="400"  y="0" width="100" height="533" fill="#267826"/>
  <rect x="500"  y="0" width="100" height="533" fill="#2e8c2e"/>
  <rect x="600"  y="0" width="100" height="533" fill="#267826"/>
  <rect x="700"  y="0" width="100" height="533" fill="#2e8c2e"/>
  <rect x="800"  y="0" width="100" height="533" fill="#267826"/>
  <rect x="900"  y="0" width="100" height="533" fill="#2e8c2e"/>
  <rect x="1000" y="0" width="100" height="533" fill="#267826"/>

  <!-- ── Sidelines ── -->
  <line x1="100" y1="2"   x2="1100" y2="2"   stroke="white" stroke-width="4"   opacity="0.80"/>
  <line x1="100" y1="531" x2="1100" y2="531" stroke="white" stroke-width="4"   opacity="0.80"/>

  <!-- ── Goal lines ── -->
  <line x1="100"  y1="0" x2="100"  y2="533" stroke="white" stroke-width="5" opacity="0.90"/>
  <line x1="1100" y1="0" x2="1100" y2="533" stroke="white" stroke-width="5" opacity="0.90"/>

  <!-- ── 10-yard lines (no 5-yard lines — keeps segments wide and open) ── -->
  <line x1="200"  y1="2" x2="200"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="300"  y1="2" x2="300"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="400"  y1="2" x2="400"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="500"  y1="2" x2="500"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="600"  y1="2" x2="600"  y2="531" stroke="white" stroke-width="4" opacity="0.80"/>
  <line x1="700"  y1="2" x2="700"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="800"  y1="2" x2="800"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="900"  y1="2" x2="900"  y2="531" stroke="white" stroke-width="3" opacity="0.70"/>
  <line x1="1000" y1="2" x2="1000" y2="531" stroke="white" stroke-width="3" opacity="0.70"/>

  <!-- ── Hash marks across the entire play field ── -->
  <rect x="100" y="0" width="1000" height="533" fill="url(#h)"/>

  <!-- ── Numbers — near top sideline (normal orientation) ── -->
  <text x="200"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">10</text>
  <text x="300"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">20</text>
  <text x="400"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">30</text>
  <text x="500"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">40</text>
  <text x="600"  y="70" text-anchor="middle" fill="white" opacity="0.72" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">50</text>
  <text x="700"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">40</text>
  <text x="800"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">30</text>
  <text x="900"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">20</text>
  <text x="1000" y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">10</text>

  <!-- ── Numbers — near bottom sideline (rotated 180° so readable from other side) ── -->
  <g transform="rotate(180,600,266.5)">
    <text x="200"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">10</text>
    <text x="300"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">20</text>
    <text x="400"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">30</text>
    <text x="500"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">40</text>
    <text x="600"  y="70" text-anchor="middle" fill="white" opacity="0.72" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">50</text>
    <text x="700"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">40</text>
    <text x="800"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">30</text>
    <text x="900"  y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">20</text>
    <text x="1000" y="70" text-anchor="middle" fill="white" opacity="0.65" font-size="52" font-family="Arial Black,Impact,sans-serif" font-weight="900" letter-spacing="6">10</text>
  </g>
</svg>
